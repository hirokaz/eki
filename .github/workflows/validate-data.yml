name: validate-data

on:
  push:
    branches: [main]
    paths:
      - 'data/**.json'
      - 'scripts/validate-data.mjs'
      - '.github/workflows/validate-data.yml'
  pull_request:
    paths:
      - 'data/**.json'
      - 'scripts/validate-data.mjs'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate data invariants
        run: node scripts/validate-data.mjs
